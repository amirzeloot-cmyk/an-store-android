<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>پنل ادمین | A·N STORE</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#070a14;--bg2:#0f141f;--card:#121a2b;--border:rgba(255,255,255,.08);--text:#eef2ff;--muted:#8b9bb5;--accent:#facc15}
body{font-family:'Vazirmatn',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
a{color:inherit;text-decoration:none}
.container{width:min(1280px,92%);margin:0 auto}
.login-wrap{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(600px 400px at 50% 0%, rgba(250,204,21,.12), transparent 60%)}
.login-card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:28px;width:min(420px,100%);box-shadow:0 20px 60px rgba(0,0,0,.5)}
.login-card h1{font-size:22px;font-weight:900;text-align:center;margin-bottom:6px}
.login-card p{font-size:12px;color:var(--muted);text-align:center;margin-bottom:18px}
.field{margin-bottom:12px}
.field label{font-size:12px;font-weight:700;color:var(--muted);display:block;margin-bottom:6px}
.input{width:100%;background:var(--bg2);border:1px solid var(--border);padding:12px 14px;border-radius:12px;color:var(--text);font-size:13px;outline:none}
.input:focus{border-color:#facc15;box-shadow:0 0 0 3px rgba(250,204,21,.15)}
.btn-primary{width:100%;background:linear-gradient(180deg,#fde68a,#facc15 30%,#f59e0b);color:#0f172a;border:none;padding:12px;border-radius:12px;font-weight:900;cursor:pointer}
.btn-ghost{background:var(--card);border:1px solid var(--border);padding:10px 14px;border-radius:10px;color:var(--text);cursor:pointer}
.header{position:sticky;top:0;z-index:20;background:rgba(7,10,20,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:14px 0}
.header-inner{display:flex;justify-content:space-between;align-items:center;gap:12px}
.logo{font-weight:900;font-size:18px;display:flex;gap:8px;align-items:center}
.logo span{color:#facc15}
.tabs{display:flex;gap:6px;background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:4px;margin:16px 0}
.tab{flex:1;padding:10px;border-radius:8px;border:none;background:transparent;color:var(--muted);font-weight:700;cursor:pointer}
.tab.active{background:#facc15;color:#0f172a}
.panel{display:none}
.panel.active{display:block}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:12px}
.order-head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.badge{padding:4px 10px;border-radius:999px;font-size:11px;font-weight:800}
.badge-pending{background:rgba(245,158,11,.15);color:#f59e0b;border:1px solid rgba(245,158,11,.3)}
.badge-done{background:rgba(34,197,94,.15);color:#22c55e;border:1px solid rgba(34,197,94,.3)}
.badge-wait{background:rgba(59,130,246,.15);color:#60a5fa;border:1px solid rgba(59,130,246,.3)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:700px){.grid2{grid-template-columns:1fr}}
.chat-list{max-height:60vh;overflow:auto;display:flex;flex-direction:column;gap:8px}
.chat-item{padding:10px 12px;border-radius:12px;background:var(--bg2);border:1px solid var(--border);cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.chat-item.active{border-color:#facc15;background:rgba(250,204,21,.08)}
.chat-box{height:340px;overflow:auto;background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.bubble{max-width:80%;padding:8px 12px;border-radius:12px;font-size:13px;line-height:1.6}
.bubble.user{background:#1e293b;align-self:flex-start}
.bubble.admin{background:linear-gradient(135deg,#facc15,#f59e0b);color:#0f172a;align-self:flex-end;font-weight:700}
.input-row{display:flex;gap:8px;margin-top:10px}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;text-align:center}
.stat b{font-size:22px;color:#facc15;display:block}
.stat span{font-size:11px;color:var(--muted)}
@media(max-width:800px){.stat-grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>

<div id="loginView" class="login-wrap">
  <div class="login-card">
    <h1><i class="fa-solid fa-shield-halved" style="color:#facc15"></i> ورود ادمین</h1>
    <p>ایدی و پسوورد ادمین را وارد کنید — ورود خودکار فعال است</p>
    <div class="field"><label>آیدی ادمین</label><input id="adminId" class="input" placeholder="آیدی ادمین" autocomplete="username"></div>
    <div class="field"><label>پسورد</label><input id="adminPass" class="input" type="password" placeholder="••••••••" autocomplete="current-password"></div>
    <label style="display:flex;gap:8px;align-items:center;font-size:12px;margin:10px 0;cursor:pointer"><input type="checkbox" id="remember" checked> مرا به خاطر بسپار (ورود خودکار)</label>
    <button class="btn-primary" onclick="doLogin()">ورود به پنل <i class="fa-solid fa-arrow-left"></i></button>
    <div id="loginMsg" style="margin-top:10px;font-size:12px"></div>
    <p style="margin-top:14px;text-align:center"><a href="index.html" style="color:var(--muted);font-size:12px"><i class="fa-solid fa-house"></i> بازگشت به سایت</a></p>
  </div>
</div>

<div id="dashView" style="display:none">
  <div class="header">
    <div class="container header-inner">
      <div class="logo"><span>A·N</span> STORE — پنل ادمین <small style="background:#22c55e;color:#fff;padding:2px 8px;border-radius:999px;font-size:10px;margin-right:8px">آنلاین</small></div>
      <div style="display:flex;gap:8px;align-items:center">
        <span id="adminName" style="font-size:12px;color:var(--muted)"></span>
        <button class="btn-ghost" onclick="doLogout()"><i class="fa-solid fa-right-from-bracket"></i> خروج</button>
      </div>
    </div>
  </div>
  <div class="container" style="padding:16px 0 40px">
    <div class="stat-grid">
      <div class="stat"><b id="stOrders">۰</b><span>کل سفارشات</span></div>
      <div class="stat"><b id="stPending">۰</b><span>در انتظار</span></div>
      <div class="stat"><b id="stChats">۰</b><span>چت‌های باز</span></div>
      <div class="stat"><b id="stUsers">۰</b><span>کاربران</span></div>
    </div>
    <div class="tabs">
      <button class="tab active" onclick="switchTab('orders')">📦 سفارشات تکی</button>
      <button class="tab" onclick="switchTab('support')">💬 پشتیبانی زنده</button>
      <button class="tab" onclick="switchTab('users')">👥 کاربران</button>
    </div>

    <div id="panel-orders" class="panel active"></div>
    <div id="panel-support" class="panel">
      <div class="grid2">
        <div>
          <h4 style="font-size:13px;margin-bottom:8px">لیست گفتگوها</h4>
          <div id="chatList" class="chat-list"></div>
        </div>
        <div>
          <h4 style="font-size:13px;margin-bottom:8px">پاسخ — <span id="activeChatName" style="color:#facc15">انتخاب کنید</span></h4>
          <div id="adminChatBox" class="chat-box"><div style="color:var(--muted);font-size:12px;text-align:center;margin-top:40px">یک گفتگو را انتخاب کنید</div></div>
          <div class="input-row">
            <input id="adminReply" class="input" placeholder="پاسخ ادمین..." onkeydown="if(event.key==='Enter') sendAdminReply()">
            <button class="btn-primary" style="width:auto;padding:10px 16px" onclick="sendAdminReply()">ارسال</button>
          </div>
        </div>
      </div>
    </div>
    <div id="panel-users" class="panel"></div>
  </div>
</div>

<script>
const ADMIN_USER = 'admin';
const ADMIN_PASS = 'admin123';

function doLogin(){
  const id=document.getElementById('adminId').value.trim();
  const pass=document.getElementById('adminPass').value;
  const rem=document.getElementById('remember').checked;
  const msg=document.getElementById('loginMsg');
  if(id===ADMIN_USER && pass===ADMIN_PASS){
    const session={id, time:Date.now(), remember:rem};
    localStorage.setItem('an_admin_session', JSON.stringify(session));
    if(rem) localStorage.setItem('an_admin_remember','1');
    msg.innerHTML='<span style="color:#22c55e">✅ ورود موفق — در حال انتقال...</span>';
    setTimeout(showDash, 400);
  }else{
    msg.innerHTML='<span style="color:#ef4444">❌ آیدی یا پسوورد اشتباه است</span>';
  }
}
function checkAuto(){
  const sess = JSON.parse(localStorage.getItem('an_admin_session')||'null');
  const rem = localStorage.getItem('an_admin_remember');
  if(sess && sess.id===ADMIN_USER && (sess.remember || rem)){
    // auto login if within 30 days
    if(Date.now() - sess.time < 30*24*60*60*1000){
      showDash();
      return true;
    }
  }
  return false;
}
function showDash(){
  document.getElementById('loginView').style.display='none';
  document.getElementById('dashView').style.display='block';
  const sess = JSON.parse(localStorage.getItem('an_admin_session')||'{}');
  document.getElementById('adminName').textContent = 'ادمین: ' + (sess.id||'admin');
  loadOrders();
  loadChats();
  loadUsers();
  setInterval(()=>{ loadOrders(); loadChats(); }, 3000);
}
function doLogout(){
  localStorage.removeItem('an_admin_session');
  localStorage.removeItem('an_admin_remember');
  location.reload();
}
function switchTab(name){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.querySelector(`[onclick="switchTab('${name}')"]`).classList.add('active');
  document.getElementById('panel-'+name).classList.add('active');
  if(name==='orders') loadOrders();
  if(name==='support') loadChats();
  if(name==='users') loadUsers();
}

// Orders
function loadOrders(){
  const orders = JSON.parse(localStorage.getItem('an_orders')||'[]');
  const pending = orders.filter(o=> !o.status || o.status==='pending').length;
  document.getElementById('stOrders').textContent = orders.length.toLocaleString('fa-IR');
  document.getElementById('stPending').textContent = pending.toLocaleString('fa-IR');
  const el=document.getElementById('panel-orders');
  if(orders.length===0){ el.innerHTML='<div class="card" style="text-align:center;color:var(--muted)">هنوز سفارشی ثبت نشده</div>'; return; }
  el.innerHTML = orders.slice().reverse().map(o=>{
    const isDone = o.status==='done';
    return `<div class="card">
      <div class="order-head">
        <div><b>${o.code}</b> <small style="color:var(--muted)">— ${new Date(o.time).toLocaleString('fa-IR')}</small><br>
        <span style="font-size:12px">آیدی: <b>${o.id}</b> • موبایل: ${o.phone} • مقدار: <b>${o.uc?.toLocaleString('fa-IR')} یوسی</b> • مبلغ: <b style="color:#facc15">${(o.price||0).toLocaleString('fa-IR')} ت</b></span></div>
        <div style="display:flex;gap:6px;align-items:center">
          <span class="badge ${isDone?'badge-done':'badge-pending'}">${isDone?'تحویل شده':'در انتظار'}</span>
          ${!isDone?`<button class="btn-primary" style="width:auto;padding:6px 12px;font-size:12px" onclick="markDone('${o.code}')">تحویل شد ✓</button>`:''}
          <button class="btn-ghost" style="padding:6px 10px;font-size:12px" onclick="viewOrder('${o.code}')"><i class="fa-solid fa-eye"></i></button>
        </div>
      </div>
      <div id="order-detail-${o.code}" style="display:none;margin-top:10px;background:var(--bg2);border:1px dashed var(--border);border-radius:10px;padding:10px;font-size:12px">
        <div>کد: ${o.code}</div><div>یوسی: ${o.uc}</div><div>آیدی: ${o.id}</div><div>موبایل: ${o.phone}</div><div>زمان: ${new Date(o.time).toLocaleString('fa-IR')}</div><div>وضعیت: ${o.status||'pending'}</div>
      </div>
    </div>`;
  }).join('');
}
function markDone(code){
  let orders=JSON.parse(localStorage.getItem('an_orders')||'[]');
  const idx=orders.findIndex(o=>o.code===code);
  if(idx>-1){ orders[idx].status='done'; localStorage.setItem('an_orders', JSON.stringify(orders)); loadOrders(); }
}
function viewOrder(code){
  const el=document.getElementById('order-detail-'+code);
  if(el) el.style.display = el.style.display==='none'?'block':'none';
}

// Support
let activeChat = null;
function loadChats(){
  const chats = JSON.parse(localStorage.getItem('an_chats')||'{}'); // {userId: [{from, text, time}]}
  const users = Object.keys(chats);
  document.getElementById('stChats').textContent = users.length.toLocaleString('fa-IR');
  const list=document.getElementById('chatList');
  if(users.length===0){ list.innerHTML='<div style="color:var(--muted);font-size:12px;text-align:center">هنوز چتی ثبت نشده</div>'; return; }
  list.innerHTML = users.map(uid=>{
    const msgs = chats[uid];
    const last = msgs[msgs.length-1];
    const unread = msgs.filter(m=>m.from==='user' && !m.seen).length;
    return `<div class="chat-item ${activeChat===uid?'active':''}" onclick="openChat('${uid}')">
      <div><b style="font-size:13px">${uid}</b><div style="font-size:11px;color:var(--muted)">${(last?.text||'').slice(0,30)} — ${last?new Date(last.time).toLocaleTimeString('fa-IR'):''}</div></div>
      ${unread?`<span style="background:#ef4444;color:#fff;padding:2px 8px;border-radius:999px;font-size:11px">${unread.toLocaleString('fa-IR')}</span>`:''}
    </div>`;
  }).join('');
  if(activeChat) openChat(activeChat, true);
}
function openChat(uid, silent=false){
  activeChat=uid;
  document.getElementById('activeChatName').textContent = uid;
  document.querySelectorAll('.chat-item').forEach(el=>el.classList.toggle('active', el.getAttribute('onclick')?.includes(uid)));
  const chats = JSON.parse(localStorage.getItem('an_chats')||'{}');
  const msgs = chats[uid]||[];
  // mark user msgs as seen
  msgs.forEach(m=>{ if(m.from==='user') m.seen=true; });
  chats[uid]=msgs;
  localStorage.setItem('an_chats', JSON.stringify(chats));
  const box=document.getElementById('adminChatBox');
  box.innerHTML = msgs.map(m=> `<div class="bubble ${m.from==='user'?'user':'admin'}">${m.text}<div style="font-size:10px;opacity:.6;margin-top:4px">${new Date(m.time).toLocaleTimeString('fa-IR')}</div></div>`).join('') || '<div style="color:var(--muted);font-size:12px;text-align:center">گفتگویی نیست</div>';
  box.scrollTop=box.scrollHeight;
  if(!silent) loadChats();
}
function sendAdminReply(){
  const inp=document.getElementById('adminReply');
  const text=inp.value.trim();
  if(!text || !activeChat) return;
  const chats=JSON.parse(localStorage.getItem('an_chats')||'{}');
  if(!chats[activeChat]) chats[activeChat]=[];
  chats[activeChat].push({from:'admin', text, time:Date.now(), seen:false, seenByUser:false});
  localStorage.setItem('an_chats', JSON.stringify(chats));
  inp.value='';
  openChat(activeChat);
}

// Users
function loadUsers(){
  const users=JSON.parse(localStorage.getItem('an_users')||'[]');
  document.getElementById('stUsers').textContent = users.length.toLocaleString('fa-IR');
  const el=document.getElementById('panel-users');
  if(users.length===0){ el.innerHTML='<div class="card" style="text-align:center;color:var(--muted)">کاربری ثبت نشده</div>'; return; }
  el.innerHTML = users.map(u=> `<div class="card" style="display:flex;justify-content:space-between;align-items:center">
    <div><b>${u.name}</b> <small style="color:var(--muted)">@${u.user}</small><br><span style="font-size:12px;color:var(--muted)">${u.phone} • XP: ${(parseInt(localStorage.getItem('an_xp')||'0')).toLocaleString('fa-IR')}</span></div>
    <span style="font-size:11px;background:var(--bg2);border:1px solid var(--border);padding:4px 8px;border-radius:999px">${u.id||''}</span>
  </div>`).join('');
}

// Auto check on load
window.addEventListener('load', ()=>{
  if(!checkAuto()){
    document.getElementById('loginView').style.display='grid';
  }
});
</script>
</body>
</html>
